        #summary: Teaching at Palmer Physical Laboratory (now 302 Frist Campus Center). While not a professor at Princeton, I associated with the physics professors and continued to give lectures on campus.
        highlights:
          - Developed a machine learning workflow in Python to predict cell line specific synthetic lethal interactions between paralog pairs to guide therapeutic target discovery in cancer
          - Integrated large-scale public datasets, including transcriptomics, CRISPR dependency scores, somatic mutation profiles, protein–protein interaction networks, and gene ontology annotations to engineer 16 predictive features for 5,000 gene pairs across 11 cancer cell lines and build training and testing datasets for supervised machine learning models
          - Designed and deployed a publicly accessible platform that translates ML model outputs into an interactive target prioritisation tool, enabling scientists without coding experience to design large-scale CRISPR screens
          - Systematically integrated drug and target annotations from open-source databases with results of multiple independent experimental CRISPR screens to prioritise protein families as candidate targets
          - Authored and co-authored 5 peer-reviewed publications in journals including Genome Biology, Trends in Cancer and NAR Genomics and Bioinformatics; a first-author paper currently under review at <em>Genome Medicine</em> 

      - company: Wellcome Sanger Institute
        position: Visiting Doctoral Researcher
        location: Hinxton, Cambridgeshire, United Kingdom
        start_date: 04.2024
        end_date: 07.2024
        summary: Conducted a 3-month placement at the Wellcome Sanger Institute, under the supervision of Dr. David Adams, to investigate the role of paralog genes in cancer and their potential as therapeutic targets. 
        highlights:
          - Applied linear modelling to pan-cancer CRISPR screening data to identify cancer type specific genetic interactions across melanoma, lung, and pancreatic cell line model, supporting prioritisation of therapeutic targets
          - Quantified correlations between CRISPR scores and gene expression across cancer cell lines to identify expression associated factors contributing to cancer type specific genetic interactions. 
          - Co-authored research published in Genome Biology funded by AstraZeneca and the Wellcome Trust 

      - company: Eternans Ltd.
        position: Researcher
        location: Istanbul, Turkey
        start_date: 06.2018
        end_date: 03.2020
        highlights:
          - Generated senescent cell models by inducing senescence in fibroblast cell lines, then screened novel senolytic peptide candidates against these and cancer cell lines using cell viability assays to quantify efficacy 
          - Analysed the resulting data to rank and prioritise lead candidates, presenting findings in weekly meetings and contributing to decision making alongside collaborators at Imperial College London, UK and Oregon Health & Science University, USA

      - company: Mettler Toledo, Turkey
        position: Marketing Communications Specialist
        location: Istanbul, Turkey
        start_date: 01.2015
        end_date: 01.2018
        highlights:
          - Prepared technical marketing materials such as brochures, whitepapers, and seminar content for precision instruments used across pharma, chemistry, and petrochemistry industries 
          - Collaborated with the sales team to translate and localize technical product specifications, supporting adoption of the products among scientific and industrial stakeholders

