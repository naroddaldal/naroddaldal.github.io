        location: Dublin, Ireland
        start_date: "2021-12"
        end_date: "2026-05"
        #summary: Teaching at Palmer Physical Laboratory (now 302 Frist Campus Center). While not a professor at Princeton, I associated with the physics professors and continued to give lectures on campus.
        highlights:
          - Developed a machine learning workflow in Python to predict cell line specific synthetic lethal interactions between paralog pairs to guide therapeutic target discovery in cancer
          - Integrated large-scale public datasets, including transcriptomics, CRISPR dependency scores, somatic mutation profiles, protein–protein interaction networks, and gene ontology annotations to engineer 16 predictive features for 5,000 gene pairs across 11 cancer cell lines and build training and testing datasets for supervised machine learning models
          - Designed and deployed a publicly accessible platform that translates ML model outputs into an interactive target prioritisation tool, enabling scientists without coding experience to design large-scale CRISPR screens
          - Systematically integrated drug and target annotations from open-source databases such as OpenTargets, ChEMBL with results of multiple independent combinatorial CRISPR screens to prioritise protein families as candidate therapeutic targets
          - Authored and co-authored 5 peer-reviewed publications in journals including <em>Genome Biology</em>, <em>Trends in Cancer</em> and <em>NAR Genomics and Bioinformatics</em>; a first-author paper currently under review at <em>Genome Medicine</em> 

      - company: Wellcome Sanger Institute
        position: Visiting Doctoral Researcher
        location: United Kingdom
        start_date: "Apr 2024"
        end_date: "Jul 2024"
        summary: "Completed a 3-month placement (April–July 2024) under the supervision of Dr. David Adams, investigating the role of paralogs in cancer and their potential as therapeutic targets."
        highlights:
          - Applied linear modelling to pan-cancer CRISPR screening data to identify cancer type specific genetic interactions across melanoma, lung, and pancreatic cell line model, supporting prioritisation of therapeutic targets
          - Quantified correlations between CRISPR scores and gene expression across cancer cell lines to identify expression associated factors contributing to cancer type specific genetic interactions. 
          - Co-authored research published in Genome Biology funded by AstraZeneca and the Wellcome Trust 

      - company: Eternans Ltd.
        position: Researcher
        location: Istanbul, Turkey
        start_date: "2018-06"
        end_date: "2020-03"
        highlights:
          - Generated senescent fibroblast cell models and screened novel senolytic peptide candidates across senescent fibroblast and cancer cell line models using cell viability assays to quantify compound efficacy.
          - Analysed assay results to support lead candidate prioritisation, presenting findings in weekly meetings and contributing to research decisions with collaborators at Imperial College London, UK and Oregon Health & Science University, USA

      - company: Mettler Toledo, Turkey
        position: Marketing Communications Specialist
        location: Istanbul, Turkey
        start_date: "2015-01"
        end_date: "2018-01"
        highlights:
          - Executed email campaigns using Salesforce and analysed performance metrics, including click-through rates, conversion rates, and web analytics dashboards, to improve lead generation and digital engagement. 
          - Supported website localisation and updated landing-page content to improve product adoption and communication with local customers.
          - Collaborated with third-party agencies, and sales teams to prepare and proofread technical marketing materials, including brochures and whitepapers for precision instruments.
          - Managed LinkedIn content campaigns by preparing structured weekly posts to increase brand awareness, and generate leads for the sales team.
          - Coordinated industry exhibitions and seminars across the power, chemistry, and pharma sectors, working with sales and marketing stakeholders to support customer outreach and product adoption.

