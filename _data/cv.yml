  summary: "Data scientist with a PhD in Bioinformatics, funded by Marie Skłodowska-Curie Actions Doctoral Fellowship. 5+ years of experience in developing machine learning workflows on large-scale biomedical data to identify and prioritise therapeutic targets in cancer. Built a publicly available web platform to support wet lab scientists in designing libraries for CRISPR screens. Experienced across academic and industrial environments, including a placement at Wellcome Sanger Institute. Skilled in predictive modelling, workflow automation using Python and R, and translating research challenges in biology into solutions."

